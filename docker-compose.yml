version: "3.8"

services:
  web:
    build: .
    container_name: apirest_web
    ports:
      - "8000:80"
    environment:
      - DB_HOST
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    container_name: apirest_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
